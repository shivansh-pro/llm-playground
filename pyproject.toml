[project]
name = "llm-playground"
version = "0.1.0"
description = "Learning project: 10 Python libraries for LLM applications, structured around a Paper-Repo Mapper."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Shivansh Singh" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
pythonpath = ["src"]