[project]
name = "llm-playground"
version = "0.1.0"
description = "Learning project: 10 Python libraries for LLM applications, structured around a Paper-Repo Mapper."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Shivansh Singh" }]
# Core deps are intentionally LIGHT. Only things imported at module level
# across the codebase live here (pydantic for models, dotenv for secrets,
# anthropic types are lazy-imported). Heavy ML/vector/eval libs go in extras
# and are lazy-imported inside functions so that:
#   1. `import llm_playground.*` works without the heavy stack installed
#   2. CI installs only `dev` and runs fast + hermetic (all lib calls mocked)
#   3. `@pytest.mark.integration` tests exercise real libs locally, skipped in CI
dependencies = [
  "pydantic>=2.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# RAG: chunking + vector stores (Chroma + pgvector) + PDF reading
rag = [
  "chromadb>=0.5",
  "llama-index-core>=0.11",
  "llama-index-embeddings-huggingface>=0.3",
  "llama-index-vector-stores-chroma>=0.3",
  "llama-index-vector-stores-postgres>=0.2",
  "llama-index-readers-file>=0.2",
  "psycopg2-binary>=2.9",
  "pypdf>=5.0",
  # Required by LlamaIndex CodeSplitter for AST-aware (tree-sitter) chunking.
  "tree-sitter-language-pack>=0.2",
]
# LangGraph orchestration + Anthropic chat model
orchestration = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.2",
  "anthropic>=0.40",
]
# MCP server SDK
mcp = [
  "mcp>=1.0",
]
# LLM-as-judge evaluation
eval = [
  "deepeval>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --strict-markers: unknown @pytest.mark.* raises instead of silently passing.
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
pythonpath = ["src"]
markers = [
  "integration: exercises real external libs/services (Chroma, LlamaIndex, Postgres, LangGraph, MCP, DeepEval). Skipped in CI via `-m 'not integration'`; run locally after `uv sync --all-extras`.",
]