name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs of the same workflow on the same ref —
# saves CI minutes when you push twice quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Install ONLY the dev extra. Heavy libs (chromadb, llama-index,
      # langgraph, deepeval, mcp) are lazy-imported in the source and mocked
      # in unit tests, so CI does not need them. Keeps CI fast (~30s vs several
      # minutes) and hermetic (no network model downloads, no DB, no API keys).
      - name: Install project + dev deps
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Run unit tests only. Integration tests (real libs/services) are marked
      # and excluded here; they run locally after `uv sync --all-extras`.
      - name: Pytest (unit)
        run: uv run pytest -m "not integration"